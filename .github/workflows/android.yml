name: Build Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # opcionális: base64-be kódolt keystore GitHub Secretként (Settings ▸ Secrets ▸ Actions)
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Collect web files
        run: |
          mkdir -p www
          cp index.html sw.js manifest.webmanifest logo.svg ikon-192.png ikon-512.png ikon-maszkolhato.png apple-touch-icon.png www/
          # frissítési csatorna: az app arról az ágról frissül, amelyikről az APK készült
          sed -i "s/,CH='main';/,CH='${GITHUB_REF_NAME}';/" www/index.html
          grep -o "CH='[^']*'" www/index.html | head -1

      - name: Add Android platform
        run: npx cap add android

      - name: App icon
        run: |
          mkdir -p assets
          cp icon-only.png icon-foreground.png icon-background.png assets/
          npx capacitor-assets generate --android --iconBackgroundColor '#0b1a36' --iconBackgroundColorDark '#0b1a36'

      - name: Landscape and fullscreen
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' "$M"
          grep -q 'android.permission.VIBRATE' "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' "$M"
          S=android/app/src/main/res/values/styles.xml
          sed -i 's#<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">#&\n        <item name="android:windowFullscreen">true</item>#' "$S"

      - name: Sync
        run: npx cap sync android

      # Állandó aláíró kulcs: enélkül minden build új kulcsot kap, és az Android
      # nem engedi rátelepíteni az új APK-t a régire.
      - name: Signing key from cache
        if: env.KS_B64 == ''
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: crc-play-debug-keystore-v1

      - name: Signing key (secret / create once)
        run: |
          mkdir -p ~/.android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ~/.android/debug.keystore
            echo "Kulcs: GitHub Secret"
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 12000 -dname "CN=CRC PLAY Debug,O=CRC PLAY,C=HU"
            echo "Kulcs: új (a cache elmenti a következő buildekhez)"
          else
            echo "Kulcs: cache-ből"
          fi
          # a Gradle-nek kifejezetten megadjuk ezt a kulcsot (különben máshol sajátot generál)
          KS="$HOME/.android/debug.keystore"
          sed -i "0,/^android {/s##android {\n    signingConfigs { debug { storeFile file('$KS'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }#" android/app/build.gradle
          grep -n -A1 "^android {" android/app/build.gradle
          keytool -list -keystore "$KS" -storepass android | grep -i "SHA-256\|SHA256"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify signing certificate (az állandó kulccsal kell aláírva lennie)
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E "Owner|SHA256:"
          A=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -o "SHA256: .*" | head -1)
          K=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -o "SHA256: .*" | head -1)
          echo "APK: $A"; echo "Kulcs: $K"
          [ "$A" = "$K" ] || { echo "HIBA: az APK nem az állandó kulccsal van aláírva"; exit 1; }

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CRC-PLAY.apk

      - name: Read app version
        id: ver
        run: |
          V=$(grep -o "VER='[^']*'" index.html | head -1 | cut -d"'" -f2)
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: CRC-PLAY-apk
          path: CRC-PLAY.apk

      - name: Publish release (letölthető APK)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CRC PLAY – legfrissebb APK (${{ steps.ver.outputs.v }})
          body: "Telepítsd Androidra (Ismeretlen források engedélyezése szükséges). VER=${{ steps.ver.outputs.v }}"
          files: CRC-PLAY.apk
          make_latest: true

      - name: Publish preview (letölthető APK más ágakról)
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          target_commitish: ${{ github.sha }}
          name: CRC PLAY – előzetes APK (${{ steps.ver.outputs.v }})
          body: "Előzetes (teszt) build a(z) ${{ github.ref_name }} ágról. Telepítsd Androidra (Ismeretlen források engedélyezése szükséges). VER=${{ steps.ver.outputs.v }}"
          files: CRC-PLAY.apk
          prerelease: true
          make_latest: false
          overwrite_files: true
